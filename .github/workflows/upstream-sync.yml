# Keeps this fork's main beside yetone/magpie: the raw branch is rebased on
# a current main by hand, and upstream moves every few hours. A merge, not a
# force: the fork's own commits (this workflow, and anything else main
# carries) stay.
name: upstream sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge yetone/magpie's main
        run: |
          git config user.name "magpie upstream sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin main
